name: OpsPilot
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opspilot
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: opspilot_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U opspilot" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e '.[dev]'
      - run: ruff check . && ruff format --check . && mypy app
      - run: pytest
      - run: alembic upgrade head
        env:
          OPSPILOT_DATABASE_URL: postgresql+asyncpg://opspilot:ci-only-password@localhost:5432/opspilot_test
      - run: pytest
        env:
          OPSPILOT_TEST_DATABASE_URL: postgresql+asyncpg://opspilot:ci-only-password@localhost:5432/opspilot_test
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm run test:run && npm run build
      - run: npm audit --omit=dev --audit-level=high
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: docker compose up --build -d --wait --wait-timeout 240
      - run: npm ci && npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: frontend
      - if: always()
        run: docker compose logs --no-color > compose.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-results
          path: |
            compose.log
            frontend/playwright-report
            frontend/test-results
      - if: always()
        run: docker compose down
